/**:
  ros__parameters:
    global_frame: "panda_link0"
    voxel_size: 0.01
    num_cameras: 3
    use_tf_transforms: true
    mapping_type: "static_tsdf"
    esdf_mode: "3d"
    use_depth: true
    use_color: false
    use_lidar: false
    input_qos: "DEFAULT"
    tick_period_ms: 10
    integrate_depth_rate_hz: 30.0
    update_esdf_rate_hz: 0.0
    update_mesh_rate_hz: 0.0
    publish_layer_rate_hz: 0.0
    publish_debug_vis_rate_hz: 0.0
    decay_tsdf_rate_hz: 0.0
    clear_map_outside_radius_rate_hz: 0.0
    map_clearing_radius_m: -1.0
    static_mapper:
      do_depth_preprocessing: false
      projective_integrator_max_integration_distance_m: 3.0
      projective_integrator_truncation_distance_vox: 4.0
      projective_integrator_weighting_mode: "inverse_square_tsdf_distance_penalty"
      projective_integrator_max_weight: 5.0
      projective_tsdf_integrator_invalid_depth_decay_factor: -1.0
      raycast_subsampling_factor: 1
      workspace_bounds_type: "bounding_box"
      workspace_bounds_min_corner_x_m: -0.3
      workspace_bounds_max_corner_x_m: 1.3
      workspace_bounds_min_corner_y_m: -0.8
      workspace_bounds_max_corner_y_m: 0.8
      workspace_bounds_min_height_m: -0.05
      workspace_bounds_max_height_m: 1.55
      esdf_integrator_min_weight: 0.1
      esdf_integrator_max_site_distance_vox: 2.0
      esdf_integrator_max_distance_m: 1.0
      unobserved_esdf_policy: "occupied"
      add_negative_truncation_band_sites: false
